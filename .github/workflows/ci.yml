name: FREE CASH CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: freecash
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Sync Database
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/freecash?schema=public"
        run: |
          npx prisma generate
          npx prisma db push

      - name: Seed Database
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/freecash?schema=public"
        run: npx prisma db seed

      - name: Typecheck & Build Next.js
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/freecash?schema=public"
          JWT_SECRET: "ci-cd-test-jwt-secret-key-32-chars-min"
        run: npx next build

      - name: Run Master E2E Integration Test Suite
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/freecash?schema=public"
          JWT_SECRET: "ci-cd-test-jwt-secret-key-32-chars-min"
        run: node prisma/verify-all.js
